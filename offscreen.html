<!doctype html>
<!-- Offscreen document hosting the Kokoro inference worker in Chrome MV3 (see
     offscreen.js for the why: no Worker constructor in the service worker).
     Explicit <head> + at rest in the markup, script as the last child so
     offscreen.js runs at a stable point (document_start semantics inside a
     headless document raced first-message delivery in testing). -->
<html><head><meta charset="utf-8"></head><body>
<script src="offscreen.js"></script>
</body></html>
